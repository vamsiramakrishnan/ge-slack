name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run test:skills
      - run: bun run lint
      - name: Slack manifest matches the wiring
        run: bun run manifest:check
      - name: Deploy renderer refuses bad settings
        run: python3 -m unittest discover -s deploy -p 'test_*.py'
      - name: Cloud Run service renders
        run: deploy/deploy.sh --render-only
        env:
          PROJECT: ci
          REGION: europe-west1
          IMAGE: europe-west1-docker.pkg.dev/ci/ge-slack/ge-slack:ci
          RUNTIME_SA: runtime@ci.iam.gserviceaccount.com
          CRON_INVOKER: scheduler@ci.iam.gserviceaccount.com
          SLACK_TEAM_ID: T0CI
          SLACK_TEAM_DOMAIN: ci
          PUBLIC_BASE_URL: https://ge-slack.example.com
          GE_PROJECT: ci
          GE_LOCATION: eu
          GE_ENGINE: engine
          IDP_ISSUER: https://login.example.com
          IDP_CLIENT_ID: ci
          WIF_POOL_ID: ci-pool
          WIF_PROVIDER_ID: ci-provider
          GE_SLACK_KMS_KEY: projects/ci/locations/europe/keyRings/r/cryptoKeys/k

  image:
    name: Container image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build (no push)
        run: docker build --tag ge-slack:ci .
      - name: Boots and fails fast without configuration
        # The bot must refuse to start half-configured (e.g. no residency pin) rather than run.
        run: |
          set +e
          out=$(docker run --rm ge-slack:ci 2>&1)
          code=$?
          echo "$out"
          test "$code" -ne 0 && echo "$out" | grep -q 'Invalid configuration'
